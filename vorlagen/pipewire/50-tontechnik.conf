# Audiowege fuer Tontechnik Studio.
#
# Ablage: ~/.config/pipewire/pipewire.conf.d/50-tontechnik.conf
# (erledigt ./installiere.sh), danach: systemctl --user restart pipewire
#
# REAPER gibt ueber ALSA auf hw:Loopback aus, weil es das TF1 nur ueber ALSA
# erkennt. Was dort hineingeht, kommt auf hw:Loopback,1,0 wieder heraus. Diese
# Datei oeffnet genau diese Seite als Quelle, beide Uebertragungen lesen sie
# direkt:
#
#   REAPER -> hw:Loopback,0,0 -> reaper_loopback -+-> stream_radio.sh -> Icecast
#                                                 +-> stream_telefon.sh
#   stream_telefon.sh -> TelefonBruecke -> baresip -> Konferenz
#   baresip (Ton der Konferenz) -> baresip_silent (stumm)
#
#   Mithoerleitung (zweiter Anruf wie ein Zuhoerer) -> Mithoeren
#   mithoeren_stumm.monitor -> Mikrofon der Mithoerleitung (still)
#   Mithoeren wird nur gemessen, nie hoerbar gemacht.
#
# Alles hier entsteht beim Start von PipeWire, nichts muss per
# "pactl load-module" nachgeladen werden. In ~/.config/pipewire/ darf keine
# andere Datei dieselben Namen anlegen, sonst gibt es Geraete doppelt.

context.objects = [
    # REAPERs Ausgang. Format und Rate muessen zu REAPER passen (32 Bit,
    # 48 kHz), denn wer den Loopback zuerst oeffnet, legt sie fest.
    #
    # tsched und mmap aus: snd-aloop hat keine verlaessliche Zeitbasis, mit
    # timergesteuertem Scheduling knackst es.
    #
    # nofail: Fehlt snd-aloop oder das Zugriffsrecht (Gruppe audio), startet
    # PipeWire trotzdem, nur ohne diese Quelle. skripte/diagnose.sh meldet das.
    { factory = adapter
      args = {
        factory.name            = api.alsa.pcm.source
        node.name               = "reaper_loopback"
        node.description        = "REAPER (ALSA-Loopback)"
        media.class             = "Audio/Source"
        api.alsa.path           = "hw:Loopback,1,0"
        api.alsa.disable-mmap   = true
        api.alsa.disable-tsched = true
        audio.format            = "S32LE"
        audio.rate              = 48000
        audio.channels          = 2
        audio.position          = [ FL FR ]
      }
      flags = [ nofail ]
    }

    # Sammelpunkt fuer das aufbereitete Telefonsignal, baresip liest dessen
    # Monitor als Mikrofon.
    { factory = adapter
      args = {
        factory.name     = support.null-audio-sink
        node.name        = "TelefonBruecke"
        node.description = "Telefonbruecke"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
        audio.rate       = 48000
        monitor.channel-volumes = true
      }
    }

    # Ausgang von baresip. Der Ton der Konferenz wird hier verworfen.
    { factory = adapter
      args = {
        factory.name     = support.null-audio-sink
        node.name        = "baresip_silent"
        node.description = "Baresip stumm"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
        audio.rate       = 48000
      }
    }

    # Mithoerleitung: Ton der Konferenz, so wie ihn ein Zuhoerer bekommt.
    # Die Oberflaeche misst dessen Pegel, hoerbar wird er nirgends.
    { factory = adapter
      args = {
        factory.name     = support.null-audio-sink
        node.name        = "Mithoeren"
        node.description = "Mithoeren"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
        audio.rate       = 48000
        monitor.channel-volumes = true
      }
    }

    # Mikrofon der Mithoerleitung. Bleibt still, damit nichts in die
    # Konferenz zurueckgeht.
    { factory = adapter
      args = {
        factory.name     = support.null-audio-sink
        node.name        = "mithoeren_stumm"
        node.description = "Mithoeren stumm"
        media.class      = Audio/Sink
        audio.position   = [ FL FR ]
        audio.rate       = 48000
      }
    }
]
